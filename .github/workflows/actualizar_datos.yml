name: Actualizador Automatico SINTA

on:
  schedule:
    - cron: '0 6 * * 1' # Cada lunes automático
  workflow_dispatch: # Botón manual para correrlo ya

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install pandas requests

      - name: Correr actualizador
        run: python actualizar.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "Robot SINTA"
          git config --global user.email "bot@github.com"
          git add datos_actualizados.csv.gz
          git commit -m "Auto-update: Base completa histórica SINTA (2019 a hoy)" || exit 0
          git push
