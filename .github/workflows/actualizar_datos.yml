name: Actualizador SINTA

on:
  # Ejecución semanal desactivada: la app usa conectividad_aerea.zip, que se actualiza a mano.
  # schedule:
  #   - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: pip install pandas requests

      - name: Ejecutar actualizador
        run: python actualizar.py

      - name: Guardar cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update base SINTA" || exit 0
          git push
